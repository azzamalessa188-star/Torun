model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
output_dir: outputs/torun-qwen2.5-coder-7b-qlora

# Memory-conscious starter settings. Adjust to your GPU and dataset.
max_seq_length: 2048
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
warmup_ratio: 0.03
logging_steps: 10
save_steps: 100
save_total_limit: 2
seed: 42

# QLoRA / LoRA
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Data
dataset_text_field: text
